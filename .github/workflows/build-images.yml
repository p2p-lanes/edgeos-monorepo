name: Build images

on:
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: hosted-images-dev
  cancel-in-progress: false

jobs:
  checks:
    if: vars.EDGEOS_DEV_IMAGE_PUBLISH_ENABLED == 'true' && github.repository == 'p2p-lanes/edgeos-monorepo' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  boundary:
    if: vars.EDGEOS_DEV_IMAGE_PUBLISH_ENABLED == 'true' && github.repository == 'p2p-lanes/edgeos-monorepo' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check image build boundary
        run: python3 -B -m unittest discover -s scripts/tests

  build:
    needs: [checks, boundary]
    if: vars.EDGEOS_DEV_IMAGE_PUBLISH_ENABLED == 'true' && github.repository == 'p2p-lanes/edgeos-monorepo' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILD_API_URL: ${{ vars.EDGEOS_DEV_API_URL }}
      BUILD_PORTAL_DOMAIN: ${{ vars.EDGEOS_DEV_PORTAL_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public build URLs
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          error = "Valid public dev API URL and portal domain are required"
          try:
              api = urlsplit(os.environ["BUILD_API_URL"])
              portal = os.environ["BUILD_PORTAL_DOMAIN"]
              portal_url = urlsplit("https://" + portal)
              api_port, portal_port = api.port, portal_url.port
          except ValueError:
              raise SystemExit(error) from None
          def usable(host):
              host = (host or "").rstrip(".").lower()
              if not host or host == "localhost" or host.endswith(".localhost"):
                  return False
              try:
                  address = ipaddress.ip_address(host)
                  mapped = getattr(address, "ipv4_mapped", None)
                  return not (address.is_loopback or (mapped and mapped.is_loopback))
              except ValueError:
                  return True
          if not (
              api.scheme == "https" and usable(api.hostname)
              and not (api.username or api.password or api.query or api.fragment)
              and api_port != 0 and portal_port != 0
              and portal and portal_url.netloc == portal and usable(portal_url.hostname)
              and not (portal_url.path or portal_url.query or portal_url.fragment)
          ):
              raise SystemExit(error)
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Refuse stale dev revision before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          test "$current" = "$EXPECTED_SHA" || { echo 'Dev head changed; refusing publication' >&2; exit 1; }
      - id: publish-backend
        env:
          SERVICE: backend
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${SERVICE}:${GITHUB_SHA}"
          result="$(docker push "$image")"
          digest="$(printf '%s\n' "$result" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: backoffice
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backoffice/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}-backoffice:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_API_URL=${{ env.BUILD_API_URL }}
            VITE_PORTAL_DOMAIN=${{ env.BUILD_PORTAL_DOMAIN }}
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,mode=max,scope=backoffice
      - name: Refuse stale dev revision before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          test "$current" = "$EXPECTED_SHA" || { echo 'Dev head changed; refusing publication' >&2; exit 1; }
      - id: publish-backoffice
        env:
          SERVICE: backoffice
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${SERVICE}:${GITHUB_SHA}"
          result="$(docker push "$image")"
          digest="$(printf '%s\n' "$result" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: portal
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: portal/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}-portal:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: NEXT_PUBLIC_API_URL=${{ env.BUILD_API_URL }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
      - name: Refuse stale dev revision before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          test "$current" = "$EXPECTED_SHA" || { echo 'Dev head changed; refusing publication' >&2; exit 1; }
      - id: publish-portal
        env:
          SERVICE: portal
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${SERVICE}:${GITHUB_SHA}"
          result="$(docker push "$image")"
          digest="$(printf '%s\n' "$result" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: ai-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ai-service/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}-ai-service:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
      - name: Refuse stale dev revision before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)"
          test "$current" = "$EXPECTED_SHA" || { echo 'Dev head changed; refusing publication' >&2; exit 1; }
      - id: publish-ai-service
        env:
          SERVICE: ai-service
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${SERVICE}:${GITHUB_SHA}"
          result="$(docker push "$image")"
          digest="$(printf '%s\n' "$result" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Write digest manifest
        env:
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BACKEND_DIGEST: ${{ steps.publish-backend.outputs.digest }}
          BACKOFFICE_DIGEST: ${{ steps.publish-backoffice.outputs.digest }}
          PORTAL_DIGEST: ${{ steps.publish-portal.outputs.digest }}
          AI_SERVICE_DIGEST: ${{ steps.publish-ai-service.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          sha = os.environ["SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          names = ("backend", "backoffice", "portal", "ai-service")
          images = {}
          for name in names:
              digest = os.environ[name.upper().replace("-", "_") + "_DIGEST"]
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
              images[name] = f"ghcr.io/{os.environ['REPOSITORY']}-{name}@{digest}"
          Path("image-digests.json").write_text(
              json.dumps({"sha": sha, "images": images}, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
          if-no-files-found: error
          retention-days: 7

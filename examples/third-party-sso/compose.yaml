# Isolated local database/mail. Never uses the root .env or a remote database.
services:
  db:
    image: postgres:17.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-sso-only
      POSTGRES_DB: edgeos_sso
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sso-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edgeos_sso"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
volumes:
  sso-db:

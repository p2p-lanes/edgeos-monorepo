x-backend-env: &backend-env
  - BACKOFFICE_URL=${BACKOFFICE_URL?Variable not set}
  - PORTAL_URL=${PORTAL_URL?Variable not set}
  - ENVIRONMENT=${ENVIRONMENT}
  - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
  - SECRET_KEY=${SECRET_KEY?Variable not set}
  - SUPERADMIN=${SUPERADMIN?Variable not set}
  - SMTP_HOST=${SMTP_HOST}
  - SMTP_USER=${SMTP_USER}
  - SMTP_PASSWORD=${SMTP_PASSWORD}
  - SENDER_EMAIL=${SENDER_EMAIL}
  - POSTGRES_SERVER=${POSTGRES_SERVER}
  - POSTGRES_PORT=${POSTGRES_PORT}
  - POSTGRES_DB=${POSTGRES_DB}
  - POSTGRES_USER=${POSTGRES_USER?Variable not set}
  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
  - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-prefer}
  - SENTRY_DSN=${SENTRY_DSN}

services:
  prestart:
    image: edgeos-backend:${TAG-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment: *backend-env

  backend:
    image: edgeos-backend:${TAG-latest}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *backend-env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health-check/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  ai-service:
    image: edgeos-ai-service:${TAG-latest}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=3002
      - BACKEND_URL=http://backend:8000
      - AI_PROVIDER=${AI_PROVIDER-}
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - GEMINI_API_KEY=${GEMINI_API_KEY-}
      - AI_MODEL=${AI_MODEL-}
      - TOOL_APPROVAL_SECRET=${TOOL_APPROVAL_SECRET-}
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health-check').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: ai-service/Dockerfile

  backoffice:
    image: edgeos-backoffice:${TAG-latest}
    restart: always
    depends_on:
      ai-service:
        condition: service_healthy
    ports:
      - "80:80"
    build:
      context: .
      dockerfile: backoffice/Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL?Variable not set}
        # Optional: unset, the backoffice derives the portal root from its own
        # hostname (app.edgeos.world → edgeos.world). Set it when the two apps
        # don't sit on sibling subdomains.
        - VITE_PORTAL_DOMAIN=${VITE_PORTAL_DOMAIN-}
        - NODE_ENV=production

  portal:
    image: edgeos-portal:${TAG-latest}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL?Variable not set}
      # The ticketing-step live preview needs nothing here: the backoffice
      # drives it with an API-minted token, which is what authorizes it.
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${BACKEND_URL?Variable not set}
        # CDN for /_next/static (e.g. https://static.edgeos.world). Optional:
        # unset serves assets same-origin, as before.
        - ASSET_PREFIX=${ASSET_PREFIX-}

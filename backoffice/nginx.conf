server {
  listen 80;

  # Default header buffers (8k) are too small when the browser piles up
  # cookies on the host — on localhost every dev app on any port shares the
  # same cookie jar, so requests easily exceed 8k and nginx replies
  # "400 Request Header Or Cookie Too Large" before the SPA even loads.
  large_client_header_buffers 4 32k;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 256;

  root /usr/share/nginx/html;

  include /etc/nginx/snippets/security-headers.conf;

  # AI chat streams must not be buffered or compressed by nginx. Keeping the
  # route same-origin means the browser never needs direct access to the Node
  # service and the Authorization header follows the normal backoffice flow.
  location /api/ai/ {
    # Resolve the Compose service lazily so this image can also start in ECS,
    # where the ALB routes /api/ai/* directly to the standalone AI service.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ai_service ai-service;
    proxy_pass http://$ai_service:3002;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    gzip off;
  }

  # Vite build output. A missing file must be a 404, never the SPA fallback:
  # during a rolling deploy a request for a new chunk can reach an old task,
  # and a 200 index.html under a .js URL breaks the app and can get cached.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    # Unhashed public files (public/assets/images) must revalidate.
    add_header Cache-Control "no-cache" always;
  }

  # Content-hashed build files never change under the same name.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    index index.html index.htm;
    try_files $uri /index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
    # Always revalidate index.html so a deploy is picked up on the next load.
    add_header Cache-Control "no-cache" always;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
